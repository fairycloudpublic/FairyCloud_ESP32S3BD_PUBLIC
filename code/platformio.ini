[env:heZhouS3]
platform = espressif32
board = esp32-s3-devkitc-1
;board_build.flash_mode = dio
;lib_deps = thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.3.0

framework = arduino
upload_speed = 921600
monitor_speed = 115200
upload_port = COM28

; 指定为16MB的FLASH分区表
board_build.arduino.partitions = default_16MB.csv
; 指定FLASH和PSRAM的运行模式
board_build.arduino.memory_type = qio_opi
; 预定义宏，启用PSRAM
build_flags = -DBOARD_HAS_PSRAM
; 指定FLASH容量为16MB
board_upload.flash_size = 16MB

; 重载摄像头配置 指定合宙S3引脚
; build_flags = -DOVER_LOAD_CAM_CONF
;               -DHE_ZHOU_S3
;               ;esp日志级别
;               -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
;               ;-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
;               ; 指定帧大小
;               ;-DFRAMESIZE=FRAMESIZE_HVGA
;               -DFRAMESIZE=FRAMESIZE_VGA
             ; -DFRAMESIZE=FRAMESIZE_SVGA
             ;-DFRAMESIZE=FRAMESIZE_HD

debug_tool = cmsis-dap
lib_deps = 
	bblanchon/ArduinoJson@^6.21.3
	esphome/ESP32-audioI2S@^2.0.7
	; links2004/WebSockets@^2.4.1
	gilmaimon/ArduinoWebsockets@^0.5.3
	 bodmer/TFT_eSPI@^2.5.43